<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <!-- Background -->
  <rect width="256" height="256" rx="60" fill="#1B4FD8"/>
  
  <g transform="translate(8, 16)" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none">
    
    <!-- Piggy Bank (facing left) -->
    <!-- We flip the standard standard piggy bank so it faces left like the image -->
    <path d="M 210,135 
             c 0,40 -20,65 -45,65 
             h -10 v 20 c 0,5 -5,10 -10,10 h -25 c -5,0 -10,-5 -10,-10 v -20 
             q -10,0 -20,0 
             v 20 c 0,5 -5,10 -10,10 h -25 c -5,0 -10,-5 -10,-10 v -20 
             c -20,0 -35,-20 -35,-45 
             c 0,-15 -10,-20 -15,-20 
             c -5,0 -10,-5 -10,-10 v -15 c 0,-10 10,-15 20,-15 
             c 10,0 20,-10 30,-25 
             c 15,-20 40,-30 65,-30 
             c 30,0 55,15 70,40 
             c 10,15 20,40 20,60 z" />
             
    <!-- Eye -->
    <circle cx="65" cy="115" r="12" fill="#FFFFFF" stroke="none"/>
    
    <!-- Ear -->
    <path d="M 125,50 c -5,-15 -20,-25 -35,-25 c -10,0 -20,5 -25,15" />

    <!-- Tether Coin & Slot -->
    <!-- Slot -->
    <path d="M 160,40 v 20" stroke-width="16" />
    
    <!-- Tether T (shifted up and right) -->
    <g transform="translate(160, -10)">
      <path d="M -25,0 h 50 M 0,0 v 40" stroke-width="14" />
      <!-- Tether Oval / Halo -->
      <ellipse cx="0" cy="18" rx="35" ry="10" stroke-width="10" />
    </g>

  </g>
</svg>
